[project]
name = "smarty"
version = "0.1.0"
description = "Smarty - local desktop app for Tower Hill business ideas review"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-qt>=4.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
