{% extends "base.html" %}
{% block title %}Smarty - log in{% endblock %}
{% block content %}
  <div class="card">
    <h1>Smarty</h1>
    {% if error %}<p class="cautions">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">
      <input type="password" name="password" placeholder="Password" autofocus
             style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-bottom:10px;">
      <button type="submit" class="active" style="width:100%;">Log in</button>
    </form>
  </div>
{% endblock %}
