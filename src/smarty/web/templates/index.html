{% extends "base.html" %}
{% block title %}Smarty{% endblock %}
{% block content %}
  <div class="banner">
    Kept is not approval. Filing an idea here does not start outreach, a
    development change, or spending.
  </div>
  <ul class="tile-list">
    {% for tile in tiles %}
      <li><a href="/tile/{{ tile.index }}">{{ tile.label }} <span style="color:#888;font-size:0.85em;">({{ tile.count }})</span></a></li>
    {% endfor %}
  </ul>
{% endblock %}
